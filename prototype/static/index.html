<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT — Contextual Action Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #212121;
      color: #ececec;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid #2f2f2f;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 600; }
    header .badge {
      font-size: 11px;
      color: #8e8ea0;
      background: #2f2f2f;
      padding: 2px 8px;
      border-radius: 10px;
    }

    #chat { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }

    .msg { display: flex; gap: 10px; max-width: 680px; width: 100%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .user .avatar { background: #19c37d; color: #fff; }
    .assistant .avatar { background: #444654; color: #d4d4d4; }

    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
      max-width: calc(100% - 42px);
      word-break: break-word;
    }
    .user .bubble { background: #2f2f2f; border-bottom-right-radius: 4px; }
    .assistant .bubble { background: #1a1a1a; border: 1px solid #2f2f2f; border-bottom-left-radius: 4px; }

    .bubble b, .bubble strong { font-weight: 600; color: #fff; }
    .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
    .bubble li { margin: 3px 0; }
    .bubble hr { border: none; border-top: 1px solid #2f2f2f; margin: 10px 0; }
    .bubble code { background: #2f2f2f; padding: 1px 5px; border-radius: 4px; font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; color: #b5cea8; }
    .bubble p { margin: 4px 0; }

    .card {
      background: #252525;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 13px;
    }
    .card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: #19c37d; font-weight: 600; margin-bottom: 8px; }
    .card p { margin: 3px 0; color: #ccc; }
    .card .conf-id { font-family: monospace; color: #b5cea8; font-size: 12px; }

    .typing { display: flex; align-items: center; gap: 5px; padding: 11px 15px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #555; animation: bounce 1.1s ease-in-out infinite; }
    .typing span:nth-child(2) { animation-delay: .18s; }
    .typing span:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-7px); } }

    #input-area { padding: 12px 16px 20px; flex-shrink: 0; }
    #input-wrap {
      max-width: 680px; margin: 0 auto;
      display: flex; align-items: flex-end; gap: 8px;
      background: #2f2f2f; border-radius: 14px; padding: 8px 10px;
    }
    textarea {
      flex: 1; background: transparent; border: none; outline: none;
      color: #ececec; font-size: 15px; resize: none; max-height: 180px;
      line-height: 1.5; font-family: inherit;
    }
    textarea::placeholder { color: #6b6b6b; }
    #send {
      width: 34px; height: 34px; background: #19c37d; border: none;
      border-radius: 8px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    #send:hover { background: #0fa36a; }
    #send:disabled { background: #3a3a3a; cursor: not-allowed; }
    #send svg { width: 15px; height: 15px; fill: white; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 3px; }

    @media (max-width: 600px) {
      .msg { max-width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>Contextual Action Engine</h1>
  <span class="badge">Restaurant Reservations · demo_user_01</span>
</header>

<div id="chat">
  <div class="msg assistant">
    <div class="avatar">C</div>
    <div class="bubble">Hello! I can help you find and book a restaurant in Chicago. Where are you looking to eat, and when?</div>
  </div>
</div>

<div id="input-area">
  <div id="input-wrap">
    <textarea id="msg" placeholder="Ask about restaurants or make a booking…" rows="1"></textarea>
    <button id="send">
      <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const chat = document.getElementById('chat');
  const msgEl = document.getElementById('msg');
  const sendBtn = document.getElementById('send');
  let sessionId = null;

  async function init() {
    const r = await fetch('/session/new');
    const d = await r.json();
    sessionId = d.session_id;
    msgEl.focus();
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMarkdown(raw) {
    let s = escHtml(raw);
    // Bold
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Inline code
    s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    // Headers → bold paragraph
    s = s.replace(/^#{1,3} (.+)$/gm, '<strong>$1</strong>');
    // Horizontal rule
    s = s.replace(/^---$/gm, '<hr>');
    // Numbered list items
    s = s.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
    // Wrap consecutive <li> in <ol>
    s = s.replace(/(<li>[\s\S]*?<\/li>)(\n<li>[\s\S]*?<\/li>)*/g, m => '<ol>' + m + '</ol>');
    // Bullet list
    s = s.replace(/^- (.+)$/gm, '<li>$1</li>');
    s = s.replace(/(<li>(?!.*<\/ol>)[\s\S]*?<\/li>)(?!<\/ol>)/g, m => '<ul>' + m + '</ul>');
    // Paragraphs from blank lines
    s = s.replace(/\n\n/g, '</p><p>');
    s = s.replace(/\n/g, '<br>');
    return '<p>' + s + '</p>';
  }

  function appendMsg(role, html) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? 'U' : 'C'}</div>
      <div class="bubble">${html}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.id = 'typing';
    div.className = 'msg assistant';
    div.innerHTML = `
      <div class="avatar">C</div>
      <div class="bubble typing"><span></span><span></span><span></span></div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    document.getElementById('typing')?.remove();
  }

  async function send() {
    const text = msgEl.value.trim();
    if (!text || !sessionId) return;

    msgEl.value = '';
    msgEl.style.height = 'auto';
    sendBtn.disabled = true;

    appendMsg('user', escHtml(text));
    showTyping();

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text, user_id: 'demo_user_01' })
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      removeTyping();
      appendMsg('assistant', renderMarkdown(data.message));
    } catch (err) {
      removeTyping();
      appendMsg('assistant', 'Something went wrong. Please try again.');
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      msgEl.focus();
    }
  }

  msgEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  msgEl.addEventListener('input', () => {
    msgEl.style.height = 'auto';
    msgEl.style.height = Math.min(msgEl.scrollHeight, 180) + 'px';
  });
  sendBtn.addEventListener('click', send);

  init();
</script>

</body>
</html>
